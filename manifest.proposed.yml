# PROPOSED manifest for "Precedent". Verified against the Forge MCP server on 2026-11-11.
# app.id is filled in by `forge create`. Run `forge lint` after scaffolding.

app:
  id: ari:cloud:ecosystem::app/TO-BE-GENERATED
  runtime:
    name: nodejs24.x
    memoryMB: 512
  compatibility:                # multi-app: exactly one required product
    jira:
      required: true
    confluence:
      required: false
  licensing:
    enabled: true               # multi-app Marketplace listings must be PAID

permissions:
  scopes:
    # --- Jira REST (classic scopes, per get-api-required-scopes) ---
    - read:jira-work                       # GET issue; avi:jira:created/updated:issue events
    - write:jira-work                      # POST comment, PUT issue (label), POST notify
    - read:jira-user                       # GET /user/bulk (owner avatars, names)
    - read:permission:jira                 # POST /permissions/check: per-user permission check as app (MCP-safe)
    # --- Confluence REST ---
    - read:page:confluence                 # GET /wiki/api/v2/pages/{id} (granular only)
    - read:confluence-content.permission   # POST /content/{id}/permission/check: user can view source page
    # --- Rovo ---
    - read:chat:rovo                       # actions usable by customer-built agents (Rovo Studio / rovo:mcp)
    # --- Teamwork Graph (per-object scopes; product-wide EAP scopes are retired) ---
    - read:graph:issue:jira                # JiraWorkItem
    - read:graph:issue-comment:jira        # JiraWorkItemComment (decisions made in comments)
    - read:graph:project:jira              # JiraSpace
    - read:graph:page:confluence           # ConfluencePage (decision source pages)
    - read:graph:comment:confluence        # ConfluenceComment
    - read:graph:space:confluence          # ConfluenceSpace
    - read:graph:user:atlassian            # AtlassianUser (owners, "who to ask")
    - read:graph:team:atlassian            # AtlassianTeam
    - read:graph:goal:atlassian            # AtlassianGoal (work item contributes to goal)
    - read:graph:project:atlassian         # AtlassianProject (project contributes to goal)
    # Forge SQL and Forge LLM need no scope.

modules:
  # ---------- Storage + migrations (async consumer pattern from Forge SQL docs) ----------
  sql:
    - key: main
      engine: mysql
  consumer:
    - key: migration-consumer
      queue: migration-queue
      function: run-migrations
  scheduledTrigger:
    - key: migration-sweeper               # catches minor/patch releases (upgraded:app fires on major only)
      function: enqueue-migrations
      interval: hour

  # ---------- LLM (semantic re-rank, admin toggle, M8; keeps Runs on Atlassian) ----------
  llm:
    - key: rerank-llm
      model:
        - claude

  # ---------- Jira UI (UI Kit) ----------
  jira:issuePanel:
    - key: precedent-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Precedent
      icon: resource:icons;precedent.svg   # icon is REQUIRED on issuePanel

  jira:globalPage:                         # single instance per app
    - key: decision-ledger
      resource: ledger
      resolver:
        function: resolver
      render: native
      title: Decision Ledger

  jira:adminPage:
    - key: precedent-settings
      resource: settings
      resolver:
        function: resolver
      render: native
      title: Precedent settings

  # ---------- Confluence UI (UI Kit; no fullPage modules, ECO-1503) ----------
  confluence:contentBylineItem:
    - key: record-decision-byline
      resource: confluence-capture
      resolver:
        function: resolver
      render: native
      title: Record as decision

  # ---------- Triggers ----------
  trigger:
    - key: issue-conflict-check            # background cache only; panel checks live
      function: on-issue-event
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
    - key: app-lifecycle
      function: enqueue-migrations
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  # ---------- Rovo ----------
  rovo:agent:
    - key: precedent-agent
      name: Precedent
      description: Answers what your team decided, why, and who to ask — and flags work that conflicts with past decisions.
      icon: resource:icons;precedent.svg
      prompt: resource:agent-prompt;prompt.md
      conversationStarters:
        - What did we decide about caching and why?
        - Does this ticket conflict with any past decision?
        - Who should I talk to before changing our public API?
        - Draft a decision record from this page
      actions:
        - find-precedent
        - check-conflict
        - get-decision-context
        - record-decision
        - propose-revisit
      skills:
        - decision-review
      followUpPrompt: Suggest up to three short follow-up questions about related decisions, owners, or revisit dates.

  rovo:skill:
    - key: decision-review
      source:
        dir: skills/decision-review
      dependencies:
        tools:
          - find-precedent
          - check-conflict
          - get-decision-context

  rovo:mcp:
    - key: precedent-mcp
      name: Precedent
      tools:
        - find-precedent
        - check-conflict
        - get-decision-context
        - record-decision

  action:
    - key: find-precedent
      name: Find precedent
      function: actions
      actionVerb: GET
      description: >-
        Call before implementing or proposing a change, to check whether the team
        already made a decision about this topic. Returns ranked decisions with
        rationale, rejected alternatives, owner and source link.
      inputs:
        query:     { title: Query, type: string, required: true,  description: 'Topic or change in plain words, e.g. "add a Redis cache for sessions"' }
        project:   { title: Project key, type: string, required: false, description: 'Jira project key, e.g. PLAT' }
        component: { title: Component, type: string, required: false, description: Component or area name }
    - key: check-conflict
      name: Check conflict
      function: actions
      actionVerb: GET
      description: >-
        Check a Jira issue or a free-text change description against recorded
        decisions. Provide issueKey or text. Returns conflicts with the rejected
        alternative it collides with, confidence, and the owner to talk to.
      inputs:
        issueKey: { title: Issue key, type: string, required: false, description: 'Jira issue key, e.g. PLAT-412' }
        text:     { title: Change description, type: string, required: false, description: Free text if no issue key }
    - key: get-decision-context
      name: Get decision context
      function: actions
      actionVerb: GET
      description: Full decision record plus related goals, teams, linked work and people to ask.
      inputs:
        decisionId: { title: Decision ID, type: string, required: true, description: ID returned by find-precedent or check-conflict }
    - key: record-decision
      name: Record decision
      function: actions
      actionVerb: CREATE
      description: >-
        Record a new decision with status "proposed" (never accepted). List fields
        are newline-delimited strings: alternatives one per line as
        "alternative :: reason"; keywords and projects one per line.
      inputs:
        title:        { title: Title, type: string, required: true,  description: Short title }
        statement:    { title: Statement, type: string, required: true,  description: '"We will X, not Y, for Z"' }
        rationale:    { title: Rationale, type: string, required: true,  description: Why the decision was made }
        alternatives: { title: Rejected alternatives, type: string, required: false, description: 'One per line: "alternative :: reason"' }
        keywords:     { title: Keywords, type: string, required: false, description: 'One alias per line, e.g. redis' }
        projects:     { title: Projects, type: string, required: false, description: 'One Jira project key per line' }
        sourceUrl:    { title: Source link, type: string, required: false, description: Confluence page or Jira issue URL }
    - key: propose-revisit
      name: Propose revisit
      function: actions
      actionVerb: UPDATE
      description: Mark a decision as "revisit" with a reason and notify its owner.
      inputs:
        decisionId: { title: Decision ID, type: string, required: true,  description: Decision to revisit }
        reason:     { title: Reason, type: string, required: true,  description: What changed since the decision }

  # ---------- Functions ----------
  function:
    - key: resolver
      handler: index.resolver
    - key: on-issue-event
      handler: index.onIssueEvent
    - key: enqueue-migrations
      handler: index.enqueueMigrations
    - key: run-migrations
      handler: index.runMigrations
      timeoutSeconds: 900
    - key: actions
      handler: index.actions

resources:
  - key: issue-panel
    path: src/frontend/issue-panel.tsx
  - key: ledger
    path: src/frontend/ledger.tsx
  - key: settings
    path: src/frontend/settings.tsx
  - key: confluence-capture
    path: src/frontend/confluence-capture.tsx
  - key: agent-prompt
    path: src/rovo
  - key: icons
    path: static/icons
